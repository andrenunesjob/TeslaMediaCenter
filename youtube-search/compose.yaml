services:
  youtube-search:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8080"
    environment:
      ALLOWED_ORIGINS: "https://andrenunesjob.github.io"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
